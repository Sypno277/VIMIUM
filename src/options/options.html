<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kestrel — Settings</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel2: #273449;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --accent2: #1d4ed8;
        --danger: #ef4444;
        --ok: #10b981;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 24px;
        background: var(--panel);
        border-bottom: 1px solid #334155;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 { font-size: 18px; margin: 0; }
      header .synced { margin-left: auto; color: var(--muted); font-size: 12px; }
      nav {
        display: flex;
        gap: 4px;
        padding: 8px 24px;
        background: var(--panel);
        border-bottom: 1px solid #334155;
        flex-wrap: wrap;
      }
      nav button {
        background: transparent;
        color: var(--muted);
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      nav button.active, nav button:hover { background: var(--panel2); color: var(--text); }
      main { padding: 24px; max-width: 960px; margin: 0 auto; }
      section { display: none; }
      section.active { display: block; }
      .card {
        background: var(--panel);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 18px;
      }
      .card h2 { margin: 0 0 12px; font-size: 15px; }
      .row { display: flex; align-items: center; gap: 12px; margin: 8px 0; flex-wrap: wrap; }
      label { color: var(--muted); min-width: 160px; }
      input[type="text"], input[type="number"], select {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 13px;
      }
      button.primary {
        background: var(--accent); color: #fff; border: none;
        padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600;
      }
      button.ghost {
        background: transparent; color: var(--text); border: 1px solid #475569;
        padding: 8px 14px; border-radius: 6px; cursor: pointer;
      }
      .kbd {
        display: inline-block; background: var(--panel2); border: 1px solid #475569;
        border-radius: 5px; padding: 2px 8px; font-family: monospace; color: #fbbf24;
      }
      .conflict { color: var(--danger); font-size: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
      .hint-spam { color: var(--muted); font-size: 12px; margin-top: 6px; }
      textarea {
        width: 100%; min-height: 140px; background: var(--panel2); color: var(--text);
        border: 1px solid #475569; border-radius: 6px; padding: 8px; font-family: monospace;
      }
      .tip { color: var(--ok); font-size: 12px; min-height: 16px; }
      .pill { background: var(--panel2); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Kestrel</h1>
      <span class="synced" id="sync-status">Not synced yet</span>
    </header>
    <nav id="tabs">
      <button data-tab="keys" class="active">Key bindings</button>
      <button data-tab="scroll">Scrolling</button>
      <button data-tab="hints">Hints</button>
      <button data-tab="sites">Per-site</button>
      <button data-tab="access">Accessibility</button>
      <button data-tab="data">Import / Export</button>
      <button data-tab="privacy">Privacy</button>
    </nav>
    <main>
      <section id="keys" class="active"><div id="keymap-root"></div></section>
      <section id="scroll"><div id="scroll-root"></div></section>
      <section id="hints"><div id="hints-root"></div></section>
      <section id="sites"><div id="sites-root"></div></section>
      <section id="access"><div id="access-root"></div></section>
      <section id="data"><div id="data-root"></div></section>
      <section id="privacy"><div id="privacy-root"></div></section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
